name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python tests (training code, fake data)
        run: |
          pip install pandas scikit-learn joblib matplotlib
          cd ml-backend && python -m unittest discover -s tests -v
      - name: Rule-scoring tests
        run: node --experimental-strip-types --test tests/rules.test.ts
